name: Build APK

# Builds the release APK on a GitHub-hosted runner and publishes it.
#
# What is and is not needed, and why (see docs/editions.md and tmp/README-x86.md in the build notes):
#
#   * app/CMakeLists.txt and app_cht/CMakeLists.txt include generated/rexglue.cmake, so a fresh clone cannot
#     configure until the code generated from default.xex exists. Those trees (app/generated, app_cht/generated
#     and the two src/copias_literales/) are not committed, on purpose: they are translated from the game.
#   * The APK is built from app_cht, the Asia (traditional Chinese) edition tree, which this fork does commit as
#     source. So the only thing the workflow needs from outside is the Asia executable,
#     assets/game_root/default_cn.xex. The PAL default.xex is NOT needed here: it is only used to rebuild
#     app_cht/src from app/ with tools/editions/crear_arbol.py, a maintenance step done by hand (see below).
#   * The two code generators tools/codegen.sh runs are pure OSS: fetch_thirdparty.py downloads the ReXGlue SDK
#     sources, the host rexglue is built from sdk/ with clang, and the two Python steps rewrite calls in the
#     generated C++. They are cached between runs; nothing derived from the game is.
#
# The executable comes from WebDAV, through repository secrets:
#   NFSMW_XEX_BASEURL   base URL, the file is fetched from <base>/<NFSMW_XEX_FILE>
#   NFSMW_WEBDAV_USER   optional, HTTP basic auth user
#   NFSMW_WEBDAV_PASS   optional, HTTP basic auth password
# and two optional repository variables (Settings > Variables):
#   NFSMW_XEX_FILE      name of the file on the server, default_cn.xex when unset. Whatever it is called
#                       there, it lands here as assets/game_root/default_cn.xex, the name
#                       app_cht/nfsmw_manifest.toml asks for.
#   NFSMW_XEX_SHA256    expected sha256 of that file, defaulting to the Asia executable this port's table was
#                       built against (the same hash as GameEdition.SUPPORTED_SHA256, the one the APK checks
#                       the disc against). Set it only when moving to another disc revision.
#
# Signing. Upstream signs release builds with the debug key (signingConfig signingConfigs.debug in
# android/app/build.gradle), and a fresh runner has none, so AGP would generate a new one per run: every
# APK would install, but none over the previous one. The keystore in the NFSMW_KEYSTORE_BASE64 secret is
# the whole fix, and it has to be a debug keystore:
#   keytool -genkeypair -keystore debug.keystore -storetype PKCS12 -storepass android -keypass android \
#     -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
#     -dname "CN=Android Debug,O=Android,C=US"
#   base64 -w0 debug.keystore          # paste the result into the secret
# The workflow puts it where AGP looks for its debug keystore (ANDROID_USER_HOME, see the keystore step)
# and, whatever AGP signed with, the APK is checked against the keystore and re-signed with it if it has
# to be, so the release always carries that one key. Compare the "keystore certificate sha256" line of
# each run: it must stay the same, or upgrades stop working.
#
# Publishing a release needs Settings > Actions > General > Workflow permissions set to "Read and write
# permissions": the workflow cannot grant itself more than the repository allows. Without it the build still
# runs and uploads the APK as an artifact, and only the last step fails.
#
# To cut a release: push a tag (git tag v0.6.0-zh.2 && git push fork v0.6.0-zh.2). To build without
# publishing, run the workflow by hand from the Actions tab: it then only uploads the artifact.
#
# Maintenance: when app/src changes upstream, rebuild app_cht/src locally with
#   REXGLUE=out/host/rexglue PYTHON=python3 bash tools/codegen.sh app
#   python3 tools/editions/crear_arbol.py cht tools/editions/asia/tabla.tsv \
#           ../assets/game_root/default_cn.xex --parejas tools/editions/asia/parejas_corregidas.json
#   cp tools/editions/asia/tabla.tsv app_cht/tabla.tsv
# and commit the result. crear_arbol.py exits 1 when it finds addresses it cannot translate safely
# (826E4350, 826E4790, 826FBB68 at the time of writing); the tree is written anyway.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# One build at a time: the workspace and the caches are shared.
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    # 144 MB of generated C++ on four cores, ThinLTO at the end. Comfortably inside the six hour limit, but
    # it is a long build; the first runs are the ones to watch for memory (see the note in app_cht/CMakeLists.txt).
    timeout-minutes: 350
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.30.5
      # -B out/host is only the build tree: the SDK points CMAKE_RUNTIME_OUTPUT_DIRECTORY at
      # sdk/out/<platform>, which is sdk/out/linux-amd64 on a runner. The path in docs/building.md
      # (out/host/rexglue) is stale.
      REXGLUE: ${{ github.workspace }}/sdk/out/linux-amd64/rexglue
    steps:
      - uses: actions/checkout@v7

      # First, before anything expensive: the one file that has to come from the game, and the one step that
      # can fail because of a mistyped secret in seconds instead of an hour into the build. It is read while
      # the tree is generated, never while the APK is built: app_cht/CMakeLists.txt takes game_root from
      # beside the executable at run time.
      - name: Get the Asia executable (WebDAV)
        env:
          BASE: ${{ secrets.NFSMW_XEX_BASEURL }}
          FILE: ${{ vars.NFSMW_XEX_FILE || 'default_cn.xex' }}
          WANT: ${{ vars.NFSMW_XEX_SHA256 || '0cd7b9fa3957de085e298c91faa726116ad0079abaefead82c2f3337ee432e64' }}
          WEBDAV_USER: ${{ secrets.NFSMW_WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.NFSMW_WEBDAV_PASS }}
        run: |
          set -e
          if [ -z "$BASE" ]; then
            echo "::error::set the NFSMW_XEX_BASEURL secret (base URL serving the Asia executable)"
            exit 1
          fi
          mkdir -p assets/game_root
          auth=()
          [ -n "$WEBDAV_USER" ] && auth=(--user "$WEBDAV_USER:$WEBDAV_PASS")
          curl -fSL --retry 3 "${auth[@]}" -o assets/game_root/default_cn.xex "$BASE/$FILE"
          ls -l assets/game_root/default_cn.xex

          # Catch a wrong edition, a truncated download or an HTML page where the file should be, before the
          # hour-long build rather than inside it: a codegen run on the wrong executable produces a tree that
          # does not match GameEdition.SUPPORTED_SHA256 and would either fail late or ship a broken APK.
          [ "$(head -c 4 assets/game_root/default_cn.xex)" = "XEX2" ] || {
            echo "::error::$BASE/$FILE is not an Xbox 360 executable (no XEX2 header)"
            exit 1
          }
          got=$(sha256sum assets/game_root/default_cn.xex | cut -d' ' -f1)
          if [ "$got" != "$WANT" ]; then
            echo "::error::default_cn.xex sha256 $got, expected $WANT"
            exit 1
          fi
          echo "default_cn.xex: $got, as expected"

      # The generated code plus the object files need a few GB; the stock image keeps the NDK and several
      # tool caches we do not use.
      - name: Make room
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
                     "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # The host code generator is built with clang, as docs/building.md does (clang 20): the image ships an
      # older one, so take 20 from llvm.org. Only used for the host tool, never for the APK. Everything here
      # needs sudo: the job runs as an unprivileged user.
      - name: Install clang 20
        run: |
          set -e
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/llvm.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-20 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-20.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-20
          clang-20 --version

      # Third-party sources and the host code generator: OSS, no game data, safe to cache. The key covers the
      # pinned ReXGlue commit in fetch_thirdparty.py and the SDK sources, so a bump rebuilds them.
      - name: Cache third-party sources and the host code generator
        uses: actions/cache@v6
        with:
          path: |
            sdk/thirdparty
            out/host
            sdk/out/linux-amd64
          key: host-${{ runner.os }}-${{ hashFiles('tools/fetch_thirdparty.py') }}-${{ hashFiles('sdk/CMakeLists.txt', 'sdk/src/**', 'sdk/include/**') }}

      - name: Get the missing libraries
        run: python3 tools/fetch_thirdparty.py

      # sdk/src/ui/CMakeLists.txt asks pkg-config for x11-xcb and wayland-client in every Linux build
      # that is not Android, and the image has neither header. Headers are all that is wanted: the code
      # generator opens no window, so SDL stays configured as it was (X11 and Wayland off, see below).
      - name: Install the host tool's X11 and Wayland headers
        run: |
          sudo apt-get install -y -qq libx11-xcb-dev libwayland-dev
          pkg-config --modversion x11-xcb wayland-client

      - name: Build the host code generator
        run: |
          if [ ! -x "$REXGLUE" ]; then
            CC=clang-20
            CXX=clang++-20
            if ! command -v "$CC" > /dev/null; then
              echo "::warning::$CC is not installed, falling back to $(clang --version | head -1)"
              CC=clang
              CXX=clang++
            fi
            # SDL's windowing backends are off on purpose: installing the Wayland headers above would
            # otherwise turn SDL_WAYLAND on, and that needs wayland-scanner and wayland-protocols. The
            # code generator needs neither.
            #
            # -msse4.1 is what rexglue_apply_target_settings() adds to host targets on x86_64: memory.cpp
            # uses _mm_shuffle_epi8 (SSSE3) with no target attribute, which clang refuses to inline in a
            # translation unit built without the feature. The SDK's own object libraries never call that
            # helper, so pass it here.
            cmake -S sdk -B out/host -G Ninja -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
                  -DCMAKE_C_FLAGS=-msse4.1 -DCMAKE_CXX_FLAGS=-msse4.1 \
                  -DSDL_X11=OFF -DSDL_WAYLAND=OFF
            cmake --build out/host --target rexglue -j "$(nproc)"
          fi
          ls -l "$REXGLUE"
          "$REXGLUE" --version

      - name: Generate the Asia tree's code
        run: |
          REXGLUE="$REXGLUE" PYTHON=python3 \
            bash tools/codegen.sh app_cht app_cht/enganchadas.txt app_cht/tabla.tsv
          du -sh app_cht/generated/default app_cht/src/copias_literales
          df -h /

      # AGP looks for the debug keystore in <prefs>/debug.keystore, where <prefs> is ANDROID_USER_HOME when
      # that variable is set (then ANDROID_PREFS_ROOT, then ANDROID_SDK_HOME, and only then $HOME/.android).
      # Writing to $HOME/.android alone is not enough: AGP 8.7.3 ignored it and quietly generated a 30 year
      # key of its own, which is how v0.6.0-zh.1 came out signed by a key nobody has. So the file is written
      # to both places, a private copy is kept out of AGP's reach for the check below, and the build step
      # sets ANDROID_USER_HOME to match.
      - name: Restore the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.NFSMW_KEYSTORE_BASE64 }}
          USER_HOME_DIR: ${{ runner.temp }}/android-user-home
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::NFSMW_KEYSTORE_BASE64 is not set: this build gets a key of its own, and its APK cannot be installed over the previous one"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nfsmw-debug.keystore"
          chmod 600 "$RUNNER_TEMP/nfsmw-debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/nfsmw-debug.keystore" -storepass android > /dev/null || {
            echo "::error::the secret does not decode to a keystore with store password \"android\""
            exit 1
          }
          mkdir -p "$USER_HOME_DIR" ~/.android
          cp "$RUNNER_TEMP/nfsmw-debug.keystore" "$USER_HOME_DIR/debug.keystore"
          cp "$RUNNER_TEMP/nfsmw-debug.keystore" ~/.android/debug.keystore
          # Alias plus SHA256 are the thing to compare from release to release: the same pair means an
          # upgrade installs over the previous build, a different one means it does not.
          keytool -list -v -keystore "$RUNNER_TEMP/nfsmw-debug.keystore" -storepass android \
            | grep -E "^Alias name|SHA256:|Valid from"

      - name: Build the release APK
        env:
          # Where AGP looks first for its debug keystore: <ANDROID_USER_HOME>/debug.keystore, the same
          # directory the keystore step filled in.
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user-home
        run: |
          df -h /
          cd android
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Check and package the APK
        id: apk
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::no APK at $APK"; exit 1; }
          cp "$APK" "nfsmw-android-zh-arm64.apk"
          apksigner=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          # Same digest as the keystore's certificate, or the release cannot be installed over the last
          # one. apksigner prints the digest of the signer certificate, the same value keytool calls the
          # SHA256 fingerprint, only without the colons.
          digest() {
            ("$apksigner" verify --print-certs "$1" || true) \
              | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f'
          }
          KS="$RUNNER_TEMP/nfsmw-debug.keystore"
          if [ -f "$KS" ]; then
            want=$(keytool -list -v -keystore "$KS" -storepass android \
                     | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
            alias_name=$(keytool -list -v -keystore "$KS" -storepass android \
                          | sed -n 's/^Alias name: //p' | head -1)
            echo "keystore certificate sha256: $want"
            echo "keystore key alias:          $alias_name"
            got=$(digest "nfsmw-android-zh-arm64.apk")
            echo "APK signed with:             $got"
            if [ "$got" != "$want" ]; then
              echo "::warning::AGP did not use the keystore from the secret; re-signing the APK with it"
              "$apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
                --ks-key-alias "$alias_name" \
                --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false \
                --out resigned.apk "nfsmw-android-zh-arm64.apk"
              mv resigned.apk "nfsmw-android-zh-arm64.apk"
              got=$(digest "nfsmw-android-zh-arm64.apk")
            fi
            if [ "$got" != "$want" ]; then
              echo "::error::the APK is signed with $got, the keystore has $want"
              exit 1
            fi
            echo "signed with the key from NFSMW_KEYSTORE_BASE64, as expected"
          else
            echo "::warning::no NFSMW_KEYSTORE_BASE64 secret: the APK keeps the key this runner generated"
          fi
          sha256sum "nfsmw-android-zh-arm64.apk" | tee SHA256SUMS.txt
          unzip -l "nfsmw-android-zh-arm64.apk" | grep -E 'lib/arm64-v8a/(libmain|libnx)'
          "$apksigner" verify --print-certs "nfsmw-android-zh-arm64.apk"
          echo "size=$(stat -c %s nfsmw-android-zh-arm64.apk)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: nfsmw-android-zh-arm64
          path: |
            nfsmw-android-zh-arm64.apk
            SHA256SUMS.txt
          retention-days: 14

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OUT=nfsmw-android-zh-arm64.apk
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$OUT" SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$OUT" SHA256SUMS.txt \
              --title "$GITHUB_REF_NAME" \
              --notes "Built from $GITHUB_SHA by the Build APK workflow."
          fi
