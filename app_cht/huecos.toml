# ============================================================================
#  SUBDIVISION OF MULTI-ENTRY GAPS
#
#  Bug in tools/huecos.py: it assumed that one gap = one function.
#  Wrong. A gap is unclaimed space, and it can hold several small
#  functions in a row (tables of 8- and 16-byte thunks). If only the
#  start is declared, Discover swallows the whole gap as one function and the
#  other entry points become unreachable: FATAL on the first indirect
#  call to any of them.
#
#  That is why the crash kept moving: each fix uncovered the next entry
#  of the same gap. Four of the crashes landed inside gaps that were
#  already declared, at +8, +24, +64 and +96 bytes from the start.
#
#  Only the proven gaps are subdivided here, the ones where the game already
#  crashed. Subdividing all 639 blindly would mean more than 3000 declarations, and
#  most gaps do hold a single function: declaring entry points in the middle of
#  a function generates garbage code. Any remaining ones are caught with the survey.
# ============================================================================

